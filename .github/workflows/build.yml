name: Build and validate
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-build.txt -r tools/requirements-validation.txt
      - run: cmake --preset cpu -DKESTREL_REFERENCE_TESTS=ON -DPython3_EXECUTABLE=$(which python)
      - run: cmake --build --preset cpu
      - run: ctest --preset cpu --timeout 120
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset asan && cmake --build --preset asan && ctest --preset asan --timeout 120
  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake ninja-build g++ python3
      - run: cmake --preset cuda -DCMAKE_CUDA_ARCHITECTURES=80
      - run: cmake --build --preset cuda
      # Hosted runner has no GPU. Run only CPU/format tests in the CUDA-linked build.
      - run: ctest --preset cuda --exclude-regex cuda --timeout 120
